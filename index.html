<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no"
>

<title>APOYU GİYDİRMECE</title>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {

    margin: 0;
    padding: 0;

    min-height: 100%;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        radial-gradient(
            circle at top,
            #26344d 0%,
            #111827 45%,
            #070b12 100%
        );

    color: white;

    overflow-x: hidden;
}


body {
    min-height: 100vh;
}


button,
input {
    font-family: inherit;
}


button {
    cursor: pointer;
}


.container {

    width:
        min(1100px, 94%);

    margin: auto;

    padding:
        25px 0 50px;
}


/* =====================================================
   HEADER
===================================================== */

.header {

    text-align: center;

    margin-bottom: 20px;
}


.header h1 {

    margin: 0;

    font-size:
        clamp(30px, 6vw, 54px);

    font-weight: 900;

    letter-spacing: -2px;
}


.header p {

    margin:
        8px 0 0;

    color:
        #aeb9ca;

    font-size: 15px;
}


/* =====================================================
   AUTH SCREEN
===================================================== */

.auth-screen {

    position: fixed;

    inset: 0;

    z-index: 100;

    overflow-y: auto;

    padding:
        25px 15px;

    background:
        radial-gradient(
            circle at center,
            rgba(38,52,77,.96),
            rgba(3,7,18,.99)
        );
}


.auth-wrapper {

    width:
        min(1050px, 100%);

    margin:
        0 auto;

    display:
        grid;

    grid-template-columns:
        430px 1fr;

    gap: 20px;

    align-items:
        start;
}


.auth-box {

    background:
        rgba(15,23,42,.94);

    border:
        1px solid
        rgba(255,255,255,.1);

    border-radius:
        25px;

    padding:
        30px;

    box-shadow:
        0 30px 100px
        rgba(0,0,0,.55);
}


.logo {

    text-align: center;

    font-size: 58px;

    margin-bottom: 5px;
}


.auth-box h2 {

    text-align: center;

    margin:
        0 0 8px;

    font-size:
        32px;

    font-weight:
        1000;
}


.auth-description {

    text-align: center;

    color:
        #9ca3af;

    line-height:
        1.5;

    margin-bottom:
        25px;
}


.auth-tabs {

    display:
        grid;

    grid-template-columns:
        1fr 1fr;

    gap: 5px;

    padding: 5px;

    background:
        #0b1220;

    border-radius:
        13px;

    margin-bottom:
        20px;
}


.auth-tab {

    border: 0;

    padding:
        11px;

    border-radius:
        9px;

    color:
        #9ca3af;

    background:
        transparent;

    font-weight:
        800;
}


.auth-tab.active {

    background:
        #2563eb;

    color:
        white;
}


.field {

    margin-bottom:
        15px;
}


.field label {

    display: block;

    margin-bottom:
        7px;

    font-size:
        13px;

    color:
        #aeb9ca;

    font-weight:
        700;
}


.input {

    width: 100%;

    padding:
        15px;

    border-radius:
        13px;

    border:
        1px solid
        #374151;

    outline: none;

    background:
        #0b1220;

    color:
        white;

    font-size:
        16px;
}


.input:focus {

    border-color:
        #60a5fa;

    box-shadow:
        0 0 0 3px
        rgba(96,165,250,.12);
}


.primary-button {

    width: 100%;

    border: 0;

    border-radius:
        13px;

    padding:
        15px;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #7c3aed
        );

    color: white;

    font-size:
        16px;

    font-weight:
        900;

    margin-top:
        5px;
}


.primary-button:disabled {

    opacity:
        .55;

    cursor:
        not-allowed;
}


.auth-status {

    min-height:
        24px;

    margin-top:
        13px;

    text-align:
        center;

    font-size:
        14px;

    line-height:
        1.4;
}


.auth-status.error {
    color:
        #f87171;
}


.auth-status.success {
    color:
        #86efac;
}


.auth-status.loading {
    color:
        #fbbf24;
}


/* =====================================================
   AUTH LEADERBOARD
===================================================== */

.login-board {

    background:
        rgba(15,23,42,.9);

    border:
        1px solid
        rgba(255,255,255,.1);

    border-radius:
        25px;

    overflow:
        hidden;

    box-shadow:
        0 30px 100px
        rgba(0,0,0,.45);
}


.login-board-header {

    padding:
        22px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    border-bottom:
        1px solid
        rgba(255,255,255,.07);
}


.login-board-header h3 {

    margin: 0;

    font-size:
        22px;
}


.refresh {

    border: 0;

    background:
        #374151;

    color: white;

    padding:
        9px 12px;

    border-radius:
        9px;

    font-weight:
        800;

    font-size:
        12px;
}


.top-player {

    padding:
        25px;

    text-align:
        center;

    background:
        radial-gradient(
            circle at center,
            rgba(37,99,235,.2),
            transparent 70%
        );
}


.top-player .crown {

    font-size:
        42px;
}


.top-player-name {

    font-size:
        25px;

    font-weight:
        1000;

    margin-top:
        5px;
}


.top-player-score {

    color:
        #fbbf24;

    font-size:
        18px;

    font-weight:
        900;

    margin-top:
        5px;
}


.auth-score-list {

    max-height:
        380px;

    overflow-y:
        auto;
}


.auth-score-row {

    display:
        grid;

    grid-template-columns:
        55px 1fr 100px;

    align-items:
        center;

    gap: 10px;

    padding:
        13px 18px;

    border-top:
        1px solid
        rgba(255,255,255,.05);
}


.auth-score-rank {

    font-size:
        18px;

    font-weight:
        900;
}


.auth-score-name {

    font-weight:
        800;

    overflow:
        hidden;

    text-overflow:
        ellipsis;

    white-space:
        nowrap;
}


.auth-score-meta {

    color:
        #9ca3af;

    font-size:
        11px;

    margin-top:
        3px;
}


.auth-score-value {

    text-align:
        right;

    font-weight:
        1000;

    color:
        #86efac;
}


.empty {

    padding:
        35px;

    text-align:
        center;

    color:
        #9ca3af;
}


/* =====================================================
   APP
===================================================== */

.app {

    display:
        none;
}


.sound-button {

    position: fixed;

    top: 18px;
    right: 18px;

    width: 52px;
    height: 52px;

    border-radius:
        50%;

    border:
        1px solid
        rgba(255,255,255,.15);

    background:
        rgba(15,23,42,.9);

    color: white;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    font-size:
        23px;

    z-index:
        1000;

    box-shadow:
        0 8px 30px
        rgba(0,0,0,.35);

    backdrop-filter:
        blur(10px);
}


.user-badge {

    position: fixed;

    top: 25px;
    left: 22px;

    z-index:
        1000;

    padding:
        9px 14px;

    border-radius:
        20px;

    background:
        rgba(15,23,42,.9);

    border:
        1px solid
        rgba(255,255,255,.1);

    font-weight:
        800;

    font-size:
        13px;
}


.logout-button {

    position: fixed;

    top: 68px;
    left: 22px;

    z-index:
        1000;

    border: 0;

    background:
        rgba(127,29,29,.9);

    color: white;

    padding:
        7px 12px;

    border-radius:
        10px;

    font-size:
        11px;

    font-weight:
        800;
}


/* =====================================================
   GAME
===================================================== */

.game-area {

    position: relative;

    min-height:
        600px;

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius:
        24px;

    background:
        linear-gradient(
            rgba(255,255,255,.025),
            rgba(255,255,255,.01)
        );

    box-shadow:
        0 25px 80px
        rgba(0,0,0,.4);

    overflow:
        hidden;
}


.stats {

    position: absolute;

    left: 20px;
    right: 20px;
    top: 18px;

    display:
        flex;

    justify-content:
        center;

    gap: 12px;

    flex-wrap:
        wrap;

    z-index: 5;
}


.stat {

    min-width:
        120px;

    padding:
        10px 15px;

    text-align:
        center;

    border-radius:
        12px;

    background:
        rgba(15,23,42,.85);

    border:
        1px solid
        rgba(255,255,255,.08);

    backdrop-filter:
        blur(10px);
}


.stat-label {

    display: block;

    font-size:
        11px;

    color:
        #9ca3af;

    text-transform:
        uppercase;

    letter-spacing:
        1px;
}


.stat-value {

    display: block;

    margin-top:
        3px;

    font-size:
        22px;

    font-weight:
        900;
}


.target-zone {

    position: absolute;

    left: 50%;
    top: 58%;

    transform:
        translate(-50%, -50%);

    width:
        min(380px,80vw);

    height:
        400px;

    display:
        flex;

    justify-content:
        center;

    align-items:
        center;
}


.target {

    position: relative;

    width:
        min(330px,72vw);

    height:
        min(330px,72vw);

    border-radius:
        50%;

    overflow:
        hidden;

    cursor:
        pointer;

    user-select:
        none;

    touch-action:
        manipulation;

    background:
        radial-gradient(
            circle,
            #374151,
            #111827
        );

    border:
        5px solid
        #374151;

    box-shadow:
        0 30px 60px
        rgba(0,0,0,.5),
        inset 0 0 30px
        rgba(255,255,255,.08);
}


.target-placeholder {

    position:
        absolute;

    inset: 0;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    flex-direction:
        column;

    text-align:
        center;

    pointer-events:
        none;

    background:
        radial-gradient(
            circle at 35% 25%,
            #64748b,
            #1e293b 65%,
            #0f172a
        );
}


.target-placeholder strong {

    font-size:
        clamp(28px,7vw,45px);

    font-weight:
        1000;
}


.target-placeholder span {

    margin-top:
        8px;

    font-size:
        12px;

    color:
        rgba(255,255,255,.55);
}


.target.hit {

    animation:
        punch .12s linear;
}


@keyframes punch {

    0% {
        transform:
            scale(1)
            rotate(0deg);
    }

    35% {
        transform:
            scale(.94)
            rotate(-3deg);
    }

    70% {
        transform:
            scale(1.05)
            rotate(3deg);
    }

    100% {
        transform:
            scale(1)
            rotate(0deg);
    }
}


.combo {

    position:
        absolute;

    left: 50%;
    top: 34%;

    transform:
        translate(-50%,-50%)
        scale(.8);

    font-size:
        clamp(28px,7vw,55px);

    font-weight:
        1000;

    color:
        #fbbf24;

    text-shadow:
        0 0 25px
        rgba(251,191,36,.45);

    opacity:
        0;

    pointer-events:
        none;

    z-index:
        10;
}


.combo.show {

    animation:
        comboPop .25s
        ease-out forwards;
}


@keyframes comboPop {

    0% {
        opacity: 0;

        transform:
            translate(-50%,-50%)
            scale(.5);
    }

    60% {
        opacity: 1;

        transform:
            translate(-50%,-50%)
            scale(1.15);
    }

    100% {
        opacity: 1;

        transform:
            translate(-50%,-50%)
            scale(1);
    }
}


.floating-score {

    position:
        absolute;

    font-size:
        24px;

    font-weight:
        1000;

    color:
        #86efac;

    pointer-events:
        none;

    z-index:
        20;

    animation:
        floatScore .8s
        ease-out forwards;
}


@keyframes floatScore {

    0% {

        opacity: 1;

        transform:
            translate(-50%,0)
            scale(1);
    }

    100% {

        opacity: 0;

        transform:
            translate(-50%,-90px)
            scale(1.3);
    }
}


.finish-button {

    position:
        absolute;

    bottom:
        18px;

    left:
        50%;

    transform:
        translateX(-50%);

    z-index:
        20;

    padding:
        12px 20px;

    border:
        0;

    border-radius:
        12px;

    background:
        #dc2626;

    color:
        white;

    font-size:
        14px;

    font-weight:
        900;

    display:
        none;
}


.shake {

    animation:
        shake .16s
        linear;
}


@keyframes shake {

    0%,100% {
        transform:
            translate(0);
    }

    25% {
        transform:
            translate(-5px,3px);
    }

    50% {
        transform:
            translate(5px,-3px);
    }

    75% {
        transform:
            translate(-3px,-2px);
    }
}


/* =====================================================
   LEADERBOARD
===================================================== */

.leaderboard {

    margin-top:
        22px;

    border-radius:
        20px;

    background:
        rgba(15,23,42,.85);

    border:
        1px solid
        rgba(255,255,255,.08);

    overflow:
        hidden;
}


.leaderboard-header {

    padding:
        20px;

    display:
        flex;

    justify-content:
        space-between;

    align-items:
        center;
}


.leaderboard-header h2 {

    margin: 0;

    font-size:
        22px;
}


.table-row {

    display:
        grid;

    grid-template-columns:
        60px 1fr 120px 100px;

    padding:
        13px 20px;

    border-top:
        1px solid
        rgba(255,255,255,.06);

    align-items:
        center;
}


.table-header {

    color:
        #9ca3af;

    font-size:
        12px;

    text-transform:
        uppercase;
}


.rank {

    font-weight:
        900;
}


.table-score {

    text-align:
        right;

    font-weight:
        900;
}


.combo-score {

    text-align:
        right;

    color:
        #fbbf24;

    font-weight:
        800;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:800px) {

    .auth-wrapper {

        grid-template-columns:
            1fr;
    }

    .auth-box {

        max-width:
            500px;

        margin:
            auto;

        width: 100%;
    }

    .login-board {

        max-width:
            500px;

        margin:
            auto;

        width: 100%;
    }
}


@media(max-width:600px) {

    .container {

        width: 96%;

        padding-top:
            15px;
    }

    .header h1 {

        font-size:
            32px;
    }

    .game-area {

        min-height:
            590px;

        border-radius:
            18px;
    }

    .stats {

        top: 12px;

        left: 8px;
        right: 8px;

        gap: 6px;
    }

    .stat {

        min-width:
            78px;

        padding: 8px;
    }

    .stat-value {

        font-size:
            18px;
    }

    .target-zone {

        top: 57%;
    }

    .table-row {

        grid-template-columns:
            45px 1fr 90px;

        padding:
            12px;
    }

    .table-row .combo-score {

        display:
            none;
    }

    .table-header .combo-score {

        display:
            none;
    }

    .sound-button {

        width:
            46px;

        height:
            46px;

        top: 12px;

        right: 12px;

        font-size:
            21px;
    }

    .user-badge {

        top:
            12px;

        left:
            12px;
    }

    .logout-button {

        top:
            52px;

        left:
            12px;
    }
}

</style>

</head>


<body>


<!-- =====================================================
     AUTH
===================================================== -->

<div
    class="auth-screen"
    id="authScreen"
>

    <div class="auth-wrapper">


        <!-- GİRİŞ -->

        <div class="auth-box">

            <div class="logo">
                🥊
            </div>

            <h2>
                APOYU<br>
                GİYDİRMECE
            </h2>

            <div class="auth-description">

                Hesabınla giriş yap ve
                skorunu liderlik tablosuna taşı.

            </div>


            <div class="auth-tabs">

                <button
                    class="auth-tab active"
                    id="loginTab"
                >
                    GİRİŞ YAP
                </button>

                <button
                    class="auth-tab"
                    id="registerTab"
                >
                    KAYIT OL
                </button>

            </div>


            <form id="authForm">


                <div class="field">

                    <label>
                        Kullanıcı adı
                    </label>

                    <input
                        class="input"
                        id="username"
                        type="text"
                        maxlength="20"
                        minlength="3"
                        autocomplete="username"
                        placeholder="mustafa_123"
                        required
                    >

                </div>


                <div class="field">

                    <label>
                        Şifre
                    </label>

                    <input
                        class="input"
                        id="password"
                        type="password"
                        minlength="6"
                        autocomplete="current-password"
                        placeholder="••••••••"
                        required
                    >

                </div>


                <button
                    class="primary-button"
                    id="authButton"
                    type="submit"
                >
                    GİRİŞ YAP
                </button>


                <div
                    class="auth-status"
                    id="authStatus"
                ></div>


            </form>

        </div>


        <!-- SKOR TABLOSU -->

        <div class="login-board">

            <div class="login-board-header">

                <h3>
                    🏆 TOP OYUNCULAR
                </h3>

                <button
                    class="refresh"
                    id="authRefresh"
                >
                    YENİLE
                </button>

            </div>


            <div
                class="top-player"
                id="topPlayer"
            >

                <div class="crown">
                    👑
                </div>

                <div
                    class="top-player-name"
                    id="topPlayerName"
                >
                    Henüz skor yok
                </div>

                <div
                    class="top-player-score"
                    id="topPlayerScore"
                >
                    -
                </div>

            </div>


            <div
                class="auth-score-list"
                id="authScoreList"
            >

                <div class="empty">
                    Skorlar yükleniyor...
                </div>

            </div>

        </div>

    </div>

</div>



<!-- =====================================================
     APP
===================================================== -->

<div
    class="app"
    id="app"
>


<button
    class="sound-button"
    id="soundButton"
>
    🔊
</button>


<div
    class="user-badge"
    id="userBadge"
>
    👤 -
</div>


<button
    class="logout-button"
    id="logoutButton"
>
    ÇIKIŞ YAP
</button>


<div class="container">


    <div class="header">

        <h1>
            🥊 APOYU GİYDİRMECE
        </h1>

        <p>
            Ne kadar hızlı vurursan
            o kadar yüksek combo!
        </p>

    </div>


    <div
        class="game-area"
        id="gameArea"
    >


        <div class="stats">


            <div class="stat">

                <span class="stat-label">
                    Skor
                </span>

                <span
                    class="stat-value"
                    id="score"
                >
                    0
                </span>

            </div>


            <div class="stat">

                <span class="stat-label">
                    Vuruş
                </span>

                <span
                    class="stat-value"
                    id="hits"
                >
                    0
                </span>

            </div>


            <div class="stat">

                <span class="stat-label">
                    Combo
                </span>

                <span
                    class="stat-value"
                    id="comboValue"
                >
                    x0
                </span>

            </div>


            <div class="stat">

                <span class="stat-label">
                    En yüksek
                </span>

                <span
                    class="stat-value"
                    id="best"
                >
                    0
                </span>

            </div>

        </div>


        <div
            class="combo"
            id="comboText"
        >
            COMBO x2
        </div>


        <div class="target-zone">


            <div
                class="target"
                id="target"
            >

                <div
                    class="target-placeholder"
                >

                    <strong>
                        APO
                    </strong>

                    <span>
                        VUR!
                    </span>

                </div>

            </div>


        </div>


        <button
            class="finish-button"
            id="finishButton"
        >
            OYUNU BİTİR
        </button>


    </div>


    <!-- LEADERBOARD -->

    <div class="leaderboard">

        <div class="leaderboard-header">

            <h2>
                🏆 Skor Tablosu
            </h2>

            <button
                class="refresh"
                id="refreshScores"
            >
                YENİLE
            </button>

        </div>


        <div
            class="table-row table-header"
        >

            <div>
                #
            </div>

            <div>

/* =====================================================

/* =====================================================

/* =====================================================
   AUTH MODE
===================================================== */

let authMode = "login";


function setAuthMode(mode) {

    authMode = mode;

    if (mode === "login") {

        loginTab.classList.add(
            "active"
        );

        registerTab.classList.remove(
            "active"
        );

        authButton.textContent =
            "GİRİŞ YAP";

        passwordInput.autocomplete =
            "current-password";

    } else {

        registerTab.classList.add(
            "active"
        );

        loginTab.classList.remove(
            "active"
        );

        authButton.textContent =
            "HESAP OLUŞTUR";

        passwordInput.autocomplete =
            "new-password";
    }

    authStatus.textContent = "";
}


loginTab.addEventListener(
    "click",
    () => setAuthMode("login")
);


registerTab.addEventListener(
    "click",
    () => setAuthMode("register")
);


/* =====================================================
   USERNAME → EMAIL
===================================================== */

/*
   Supabase Auth email/password istediği için
   kullanıcı adına özel internal email oluşturuyoruz.

   Kullanıcı gerçek email adresini görmüyor.
*/

function usernameToEmail(username) {

    return (
        username
            .toLowerCase()
            .trim()
            .replace(
                /[^a-z0-9_]/g,
                ""
            )
        +
        "@apoyu.local"
    );
}


/* =====================================================
   USERNAME VALIDATION
===================================================== */

function validateUsername(name) {

    return /^[A-Za-z0-9_]{3,20}$/
        .test(name);
}


/* =====================================================
   AUTH FORM
===================================================== */

authForm.addEventListener(
    "submit",
    async (event) => {

        event.preventDefault();

        const username =
            usernameInput.value.trim();

        const password =
            passwordInput.value;


        if (
            !validateUsername(
                username
            )
        ) {

            authStatus.className =
                "auth-status error";

            authStatus.textContent =
                "Kullanıcı adı 3-20 karakter olmalı. Sadece harf, rakam ve _ kullanılabilir.";

            return;
        }


        if (password.length < 6) {

            authStatus.className =
                "auth-status error";

            authStatus.textContent =
                "Şifre en az 6 karakter olmalı.";

            return;
        }


        authButton.disabled =
            true;

        authStatus.className =
            "auth-status loading";


        if (authMode === "register") {

            authStatus.textContent =
                "Hesap oluşturuluyor...";


            const email =
                usernameToEmail(
                    username
                );


            const {
                data,
                error
            } =
                await supabase.auth.signUp({
                    email,
                    password,

                    options: {

                        data: {
                            username
                        }
                    }
                });


            if (error) {

                console.error(
                    error
                );

                authStatus.className =
                    "auth-status error";

                authStatus.textContent =
                    translateAuthError(
                        error.message
                    );

                authButton.disabled =
                    false;

                return;
            }


            /*
              Email confirmation kapalıysa
              session doğrudan oluşur.
            */

            if (data.session) {

                authStatus.className =
                    "auth-status success";

                authStatus.textContent =
                    "Hesap oluşturuldu.";

                await enterGame();

            } else {

                authStatus.className =
                    "auth-status success";

                authStatus.textContent =
                    "Hesap oluşturuldu. Supabase email doğrulamasını bekliyor.";
            }

        } else {

            authStatus.textContent =
                "Giriş yapılıyor...";


            const email =
                usernameToEmail(
                    username
                );


            const {
                data,
                error
            } =
                await supabase.auth.signInWithPassword({

                    email,

                    password

                });


            if (error) {

                console.error(
                    error
                );

                authStatus.className =
                    "auth-status error";

                authStatus.textContent =
                    "Kullanıcı adı veya şifre hatalı.";

                authButton.disabled =
                    false;

                return;
            }


            if (data.session) {

                await enterGame();

            }

        }


        authButton.disabled =
            false;

    }
);


/* =====================================================
   AUTH ERROR
===================================================== */

function translateAuthError(
    message
) {

    if (
        message
            .toLowerCase()
            .includes(
                "already registered"
            )
    ) {

        return "Bu kullanıcı adı zaten kullanılıyor.";
    }


    if (
        message
            .toLowerCase()
            .includes(
                "password"
            )
    ) {

        return "Şifre geçersiz.";
    }


    return (
        "İşlem başarısız: " +
        message
    );
}


/* =====================================================
   ENTER GAME
===================================================== */

async function enterGame() {

    const {
        data: {
            user
        }
    } =
        await supabase.auth.getUser();


    if (!user) return;


    const {
        data: profile
    } =
        await supabase
            .from("profiles")
            .select(
                "username"
            )
            .eq(
                "id",
                user.id
            )
            .single();


    if (profile) {

        userBadge.textContent =
            "👤 " +
            profile.username;
    }


    authScreen.style.display =
        "none";

    app.style.display =
        "block";


    resetGame();

    await renderLeaderboard();
}

   LOGOUT
===================================================== */

logoutButton.addEventListener(
    "click",
    async () => {

        gameStarted = false;

        await supabase.auth.signOut();

        app.style.display =
            "none";

        authScreen.style.display =
            "block";

        usernameInput.value =

        resetGame();

        await loadLoginLeaderboard();
    }

/* =====================================================
   AUTH SESSION
===================================================== */

supabase.auth.onAuthStateChange(
    async (
        event,
        session
    ) => {

        if (
            session &&
            (
                event ===

                event ===

            )
        ) {

            await enterGame();

    }
);


/* =====================================================
   GAME VARIABLES
===================================================== */

let gameStarted =
    false;

let score =
    0;

let hits =
    0;

let combo =
    0;

let highestCombo =
    0;

let lastHitTime =
    0;

const COMBO_TIMEOUT =
    900;


/* =====================================================
   AUDIO
===================================================== */

let audioContext =
    null;

let soundEnabled =
    true;


function initAudio() {

    if (!audioContext) {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();
    }


    if (
        audioContext.state ===
        "suspended"
    ) {

        audioContext.resume();
    }
}


function punchSound(
    critical = false
) {

    if (!soundEnabled)
        return;


    initAudio();


    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();


    oscillator.connect(gain);

    gain.connect(
        audioContext.destination
    );


    oscillator.type =
        critical
            ? "square"
            : "sine";


    oscillator.frequency.setValueAtTime(
        critical ? 180 : 110,
        audioContext.currentTime
    );


    oscillator.frequency.exponentialRampToValueAtTime(
        critical ? 80 : 55,
        audioContext.currentTime +
            .08
    );


    gain.gain.setValueAtTime(
        critical ? .13 : .08,
        audioContext.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioContext.currentTime +
            .09
    );


    oscillator.start();

    oscillator.stop(
        audioContext.currentTime +
            .1
    );
}


soundButton.addEventListener(
    "click",
    () => {

        soundEnabled =
            !soundEnabled;

        soundButton.textContent =
            soundEnabled
                ? "🔊"
                : "🔇";


        if (soundEnabled) {

            initAudio();
        }
    }
);


/* =====================================================
   GAME START
===================================================== */

function resetGame() {

    gameStarted =
        true;

    score = 0;

    hits = 0;

    combo = 0;

    highestCombo = 0;

    lastHitTime = 0;

    finishButton.style.display =
        "inline-block";

    updateStats();
}


function endGame() {

    gameStarted =
        false;

    finishButton.style.display =
        "none";
}


/* =====================================================
   HIT
===================================================== */

target.addEventListener(
    "pointerdown",
    hitTarget
);


function hitTarget(event) {

    if (!gameStarted)
        return;


    event.preventDefault();


    initAudio();


    const now =
        performance.now();


    if (
        now - lastHitTime <=
        COMBO_TIMEOUT
    ) {

        combo++;

    } else {

        combo = 1;
    }


    lastHitTime =
        now;


    hits++;


    if (
        combo >
        highestCombo
    ) {

        highestCombo =
            combo;
    }


    let multiplier =
        1;


    if (combo >= 30)
        multiplier = 5;

    else if (combo >= 20)
        multiplier = 4;

    else if (combo >= 10)
        multiplier = 3;

    else if (combo >= 5)
        multiplier = 2;


    const critical =
        Math.random() < .07;


    let points =
        10 * multiplier;


    if (critical)
        points *= 3;


    score +=
        points;


    updateStats();


    animateTarget();


    punchSound(
        critical
    );


    showFloatingScore(
        event,
        points,
        critical
    );


    if (combo >= 2)
        showCombo();
}


/* =====================================================
   ANIMATION
===================================================== */

function animateTarget() {

    target.classList.remove(
        "hit"
    );

    void target.offsetWidth;

    target.classList.add(
        "hit"
    );


    gameArea.classList.remove(
        "shake"
    );

    void gameArea.offsetWidth;

    gameArea.classList.add(
        "shake"
    );
}


function showCombo() {

    comboText.textContent =
        `COMBO x${combo}`;


    comboText.classList.remove(
        "show"
    );


    void comboText.offsetWidth;


    comboText.classList.add(
        "show"
    );
}


function showFloatingScore(
    event,
    points,
    critical
) {

    const floating =
        document.createElement(
            "div"
        );


    floating.className =
        "floating-score";


    floating.textContent =
        critical
            ? `CRITICAL +${points}`
            : `+${points}`;


    const rect =
        gameArea.getBoundingClientRect();


    const x =
        event.clientX -
        rect.left;


    const y =
        event.clientY -
        rect.top;


    floating.style.left =
        `${x}px`;


    floating.style.top =
        `${y}px`;


    if (critical) {

        floating.style.color =
            "#fbbf24";
    }


    gameArea.appendChild(
        floating
    );


    setTimeout(
        () =>
            floating.remove(),
        800
    );
}


/* =====================================================
   STATS
===================================================== */

function updateStats() {

    scoreElement.textContent =
        score.toLocaleString(
            "tr-TR"
        );


    hitsElement.textContent =
        hits;


    comboElement.textContent =
        `x${combo}`;
}


/* =====================================================
   SUBMIT SCORE
===================================================== */

finishButton.addEventListener(
    "click",
    async () => {

        if (!gameStarted)
            return;


        endGame();


        finishButton.disabled =
            true;


        finishButton.textContent =
            "KAYDEDİLİYOR...";


        try {

            const {
                data: {
                    session
                }
            } =
                await supabase.auth.getSession();


            if (!session) {

                throw new Error(
                    "Oturum bulunamadı."
                );
            }


            const {
                data,
                error
            } =
                await supabase.functions.invoke(
                    "swift-service",
                    {
                        body: {

                            action:
                                "submit_score",

                            score:
                                score,

                            hits:
                                hits,

                            highestCombo:
                                highestCombo
                        }
                    }
                );


            if (error)
                throw error;


            console.log(
                "Skor kaydedildi:",
                data
            );


            alert(
                `🏆 Skorun kaydedildi!\n\n` +
                `Skor: ${Number(
                    data.score?.score || score
                ).toLocaleString("tr-TR")}\n` +
                `Vuruş: ${hits}\n` +
                `En yüksek combo: x${highestCombo}`
            );


        } catch (error) {

            console.error(
                error
            );


            alert(
                "⚠️ Skor kaydedilemedi.\n\n" +
                (
                    error.message ||
                    "Bilinmeyen hata."
                )
            );

        }


        finishButton.disabled =
            false;


        finishButton.textContent =
            "OYUNU BİTİR";


        await renderLeaderboard();


        resetGame();

    }
);


/* =====================================================
   LEADERBOARD
===================================================== */

async function loadLeaderboard() {

    const {
        data,
        error
    } =
        await supabase
            .from("leaderboard")
            .select(
                "id,user_id,username,score,hits,highest_combo,created_at"
            )
            .order(
                "score",
                {
                    ascending: false
                }
            )
            .order(
                "highest_combo",
                {
                    ascending: false
                }
            )
            .limit(50);


    if (error) {

        console.error(
            error
        );

        throw error;
    }


    return data || [];
}


/* =====================================================
   LOGIN LEADERBOARD
===================================================== */

async function loadLoginLeaderboard() {

    try {

        const scores =
            await loadLeaderboard();


        authScoreList.innerHTML =
            "";


        if (!scores.length) {

            authScoreList.innerHTML =
                `
                <div class="empty">
                    Henüz skor yok.<br>
                    İlk oyuncu sen ol!
                </div>
                `;


            topPlayerName.textContent =
                "Henüz skor yok";

            topPlayerScore.textContent =
                "-";

            return;
        }


        const top =
            scores[0];


        topPlayerName.textContent =
            top.username;


        topPlayerScore.textContent =
            Number(
                top.score
            ).toLocaleString(
                "tr-TR"
            ) +
            " puan";


        scores.forEach(
            (
                item,
                index
            ) => {

                const row =
                    document.createElement(
                        "div"
                    );


                row.className =
                    "auth-score-row";


                const medal =
                    index === 0
                        ? "🥇"
                        : index === 1
                            ? "🥈"
                            : index === 2
                                ? "🥉"
                                : index + 1;


                row.innerHTML = `

                    <div
                        class="auth-score-rank"
                    >
                        ${medal}
                    </div>

                    <div>

                        <div
                            class="auth-score-name"
                        >
                            ${escapeHtml(
                                item.username
                            )}
                        </div>

                        <div
                            class="auth-score-meta"
                        >
                            ${item.hits} vuruş
                            ·
                            x${item.highest_combo}
                        </div>

                    </div>

                    <div
                        class="auth-score-value"
                    >
                        ${Number(
                            item.score
                        ).toLocaleString(
                            "tr-TR"
                        )}
                    </div>
                `;


                authScoreList.appendChild(
                    row
                );
            }
        );


    } catch (error) {

        console.error(
            error
        );


        authScoreList.innerHTML =
            `
            <div class="empty">
                ⚠️ Skor tablosu yüklenemedi.
            </div>
            `;
    }
}


authRefresh.addEventListener(
    "click",
    loadLoginLeaderboard
);


/* =====================================================
   GAME LEADERBOARD
===================================================== */

async function renderLeaderboard() {

    try {

        const scores =
            await loadLeaderboard();


        leaderboardRows.innerHTML =
            "";


        if (!scores.length) {

            leaderboardRows.innerHTML =
                `
                <div class="empty">
                    Henüz skor yok.
                </div>
                `;


            bestElement.textContent =
                "0";


            return;
        }


        bestElement.textContent =
            Number(
                scores[0].score
            ).toLocaleString(
                "tr-TR"
            );


        scores.forEach(
            (
                item,
                index
            ) => {

                const row =
                    document.createElement(
                        "div"
                    );


                row.className =
                    "table-row";


                const medal =
                    index === 0
                        ? "🥇"
                        : index === 1
                            ? "🥈"
                            : index === 2
                                ? "🥉"
                                : index + 1;


                row.innerHTML = `

                    <div class="rank">
                        ${medal}
                    </div>

                    <div>
                        ${escapeHtml(
                            item.username
                        )}
                    </div>

                    <div
                        class="table-score"
                    >
                        ${Number(
                            item.score
                        ).toLocaleString(
                            "tr-TR"
                        )}
                    </div>

                    <div
                        class="combo-score"
                    >
                        x${item.highest_combo}
                    </div>

                `;


                leaderboardRows.appendChild(
                    row
                );
            }
        );


    } catch (error) {

        console.error(
            error
        );


        leaderboardRows.innerHTML =
            `
            <div class="empty">
                ⚠️ Skor tablosuna bağlanılamadı.
            </div>
            `;
    }
}


refreshScores.addEventListener(
    "click",
    renderLeaderboard
);


/* =====================================================
   COMBO RESET
===================================================== */

setInterval(
    () => {

        if (!gameStarted)
            return;


        if (
            lastHitTime &&
            performance.now() -
                lastHitTime >
                COMBO_TIMEOUT
        ) {

            combo = 0;

            comboElement.textContent =
                "x0";
        }

    },
    100
);


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(text) {

    return String(text)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );
}


/* =====================================================
   INITIAL
===================================================== */

(async function init() {

    await loadLoginLeaderboard();


    const {
        data: {
            session
        }
    } =
        await supabase.auth.getSession();


    if (session) {

        await enterGame();

    }

})();

</script>
