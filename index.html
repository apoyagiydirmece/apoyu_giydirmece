<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>APOYU GİYDİRMECE</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: Arial, Helvetica, sans-serif;
    background:
        radial-gradient(circle at top, #26344d 0%, #111827 45%, #070b12 100%);
    color: white;
    overflow-x: hidden;
}

body {
    min-height: 100vh;
}

button,
input {
    font-family: inherit;
}

.container {
    width: min(1100px, 94%);
    margin: auto;
    padding: 25px 0 40px;
}

/* =========================
   HEADER
========================= */

.header {
    text-align: center;
    margin-bottom: 20px;
}

.header h1 {
    margin: 0;
    font-size: clamp(30px, 6vw, 54px);
    font-weight: 900;
    letter-spacing: -2px;
}

.header p {
    margin: 8px 0 0;
    color: #aeb9ca;
    font-size: 15px;
}

/* =========================
   SOUND BUTTON
========================= */

.sound-button {
    position: fixed;
    top: 18px;
    right: 18px;

    width: 52px;
    height: 52px;

    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.15);

    background: rgba(15,23,42,.9);
    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 24px;

    cursor: pointer;

    z-index: 100;

    box-shadow:
        0 8px 30px rgba(0,0,0,.35);

    backdrop-filter: blur(10px);

    padding: 0;
}

.sound-button:hover {
    filter: brightness(1.15);
}

.sound-button:active {
    transform: scale(.92);
}

/* =========================
   NAME SCREEN
========================= */

.name-screen {
    position: fixed;
    inset: 0;

    background:
        radial-gradient(
            circle at center,
            rgba(38,52,77,.95),
            rgba(3,7,18,.98)
        );

    display: flex;
    align-items: center;
    justify-content: center;

    z-index: 90;

    padding: 20px;

    transition:
        opacity .3s ease,
        visibility .3s ease;
}

.name-screen.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.name-box {
    width: min(460px, 94vw);

    text-align: center;

    padding: 35px 25px;

    border-radius: 24px;

    background: rgba(15,23,42,.9);

    border:
        1px solid rgba(255,255,255,.1);

    box-shadow:
        0 30px 100px rgba(0,0,0,.55);
}

.name-box h2 {
    margin: 0 0 10px;

    font-size:
        clamp(32px, 8vw, 52px);

    font-weight: 1000;
}

.name-box p {
    color: #aeb9ca;
    line-height: 1.6;
    margin-bottom: 25px;
}

.name-input {
    width: 100%;

    padding: 16px 18px;

    border:
        1px solid #374151;

    border-radius: 14px;

    background: #111827;

    color: white;

    outline: none;

    font-size: 18px;

    text-align: center;
}

.name-input:focus {
    border-color: #60a5fa;
    box-shadow:
        0 0 0 3px rgba(96,165,250,.12);
}

.name-status {
    min-height: 24px;

    margin-top: 12px;

    font-size: 14px;
}

.name-status.error {
    color: #f87171;
}

.name-status.success {
    color: #86efac;
}

.name-status.loading {
    color: #fbbf24;
}

/* =========================
   GAME AREA
========================= */

.game-area {
    position: relative;

    min-height: 560px;

    border:
        1px solid rgba(255,255,255,.08);

    border-radius: 24px;

    background:
        linear-gradient(
            rgba(255,255,255,.025),
            rgba(255,255,255,.01)
        );

    box-shadow:
        0 25px 80px rgba(0,0,0,.4);

    overflow: hidden;
}

/* =========================
   STATS
========================= */

.stats {
    position: absolute;

    left: 20px;
    right: 20px;
    top: 18px;

    display: flex;

    justify-content: center;

    gap: 12px;

    flex-wrap: wrap;

    z-index: 5;
}

.stat {
    min-width: 120px;

    padding: 10px 15px;

    text-align: center;

    border-radius: 12px;

    background:
        rgba(15,23,42,.85);

    border:
        1px solid rgba(255,255,255,.08);

    backdrop-filter: blur(10px);
}

.stat-label {
    display: block;

    font-size: 11px;

    color: #9ca3af;

    text-transform: uppercase;

    letter-spacing: 1px;
}

.stat-value {
    display: block;

    margin-top: 3px;

    font-size: 22px;

    font-weight: 900;
}

/* =========================
   TARGET
========================= */

.target-zone {
    position: absolute;

    left: 50%;
    top: 58%;

    transform:
        translate(-50%, -50%);

    width:
        min(380px, 80vw);

    height:
        400px;

    display: flex;

    justify-content: center;
    align-items: center;
}

.target {
    position: relative;

    width:
        min(330px, 72vw);

    height:
        min(330px, 72vw);

    border-radius: 50%;

    overflow: hidden;

    cursor: pointer;

    user-select: none;

    touch-action: manipulation;

    background:
        radial-gradient(
            circle,
            #374151,
            #111827
        );

    border:
        5px solid #374151;

    box-shadow:
        0 30px 60px rgba(0,0,0,.5),
        inset 0 0 30px rgba(255,255,255,.08);

    transition:
        transform .07s;
}

.target img {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    pointer-events: none;

    user-select: none;
}

.target-placeholder {
    position: absolute;

    inset: 0;

    display: flex;

    align-items: center;

    justify-content: center;

    flex-direction: column;

    text-align: center;

    pointer-events: none;

    background:
        radial-gradient(
            circle at 35% 25%,
            #64748b,
            #1e293b 65%,
            #0f172a
        );
}

.target-placeholder strong {
    font-size:
        clamp(28px, 7vw, 45px);

    font-weight: 1000;
}

.target-placeholder span {
    margin-top: 8px;

    font-size: 12px;

    color: rgba(255,255,255,.55);
}

.target.hit {
    animation:
        punch .12s linear;
}

@keyframes punch {

    0% {
        transform:
            scale(1)
            rotate(0deg);
    }

    35% {
        transform:
            scale(.94)
            rotate(-3deg);
    }

    70% {
        transform:
            scale(1.05)
            rotate(3deg);
    }

    100% {
        transform:
            scale(1)
            rotate(0deg);
    }
}

/* =========================
   COMBO
========================= */

.combo {
    position: absolute;

    left: 50%;
    top: 34%;

    transform:
        translate(-50%, -50%)
        scale(.8);

    font-size:
        clamp(28px, 7vw, 55px);

    font-weight: 1000;

    color: #fbbf24;

    text-shadow:
        0 0 25px rgba(251,191,36,.45);

    opacity: 0;

    pointer-events: none;

    z-index: 10;
}

.combo.show {
    animation:
        comboPop .25s ease-out forwards;
}

@keyframes comboPop {

    0% {
        opacity: 0;

        transform:
            translate(-50%, -50%)
            scale(.5);
    }

    60% {
        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1.15);
    }

    100% {
        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(1);
    }
}

/* =========================
   FLOATING SCORE
========================= */

.floating-score {
    position: absolute;

    font-size: 24px;

    font-weight: 1000;

    color: #86efac;

    pointer-events: none;

    z-index: 20;

    animation:
        floatScore .8s ease-out forwards;
}

@keyframes floatScore {

    0% {
        opacity: 1;

        transform:
            translate(-50%, 0)
            scale(1);
    }

    100% {
        opacity: 0;

        transform:
            translate(-50%, -90px)
            scale(1.3);
    }
}

/* =========================
   LEADERBOARD
========================= */

.leaderboard {
    margin-top: 22px;

    border-radius: 20px;

    background:
        rgba(15,23,42,.85);

    border:
        1px solid rgba(255,255,255,.08);

    overflow: hidden;
}

.leaderboard-header {
    padding: 20px;

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 10px;
}

.leaderboard-header h2 {
    margin: 0;

    font-size: 22px;
}

.table {
    width: 100%;
}

.row {
    display: grid;

    grid-template-columns:
        60px
        1fr
        120px
        100px;

    padding: 13px 20px;

    border-top:
        1px solid rgba(255,255,255,.06);

    align-items: center;
}

.row.header-row {
    color: #9ca3af;

    font-size: 12px;

    text-transform: uppercase;
}

.rank {
    font-weight: 900;
}

.score {
    font-weight: 900;

    text-align: right;
}

.combo-score {
    text-align: right;

    color: #fbbf24;

    font-weight: 800;
}

.empty {
    padding: 30px;

    text-align: center;

    color: #9ca3af;
}

/* =========================
   OVERLAY
========================= */

.overlay {
    position: absolute;

    inset: 0;

    background:
        rgba(3,7,18,.78);

    backdrop-filter:
        blur(7px);

    display: flex;

    align-items: center;
    justify-content: center;

    z-index: 30;

    text-align: center;

    padding: 20px;
}

.overlay.hidden {
    display: none;
}

.overlay-box {
    max-width: 500px;
}

.overlay h2 {
    font-size:
        clamp(28px, 7vw, 48px);

    margin: 0 0 10px;
}

.overlay p {
    color: #aeb9ca;

    line-height: 1.6;
}

/* =========================
   FINISH BUTTON
========================= */

.finish-button {
    position: absolute;

    bottom: 18px;

    left: 50%;

    transform:
        translateX(-50%);

    z-index: 20;

    padding:
        12px 20px;

    border: 0;

    border-radius: 12px;

    background: #dc2626;

    color: white;

    font-size: 14px;

    font-weight: 900;

    cursor: pointer;

    display: none;
}

/* =========================
   SHAKE
========================= */

.shake {
    animation:
        shake .16s linear;
}

@keyframes shake {

    0%,100% {
        transform:
            translate(0);
    }

    25% {
        transform:
            translate(-5px,3px);
    }

    50% {
        transform:
            translate(5px,-3px);
    }

    75% {
        transform:
            translate(-3px,-2px);
    }
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .container {
        width: 96%;

        padding-top: 15px;
    }

    .header h1 {
        font-size: 32px;
    }

    .game-area {
        min-height: 570px;

        border-radius: 18px;
    }

    .stats {
        top: 12px;

        left: 8px;
        right: 8px;

        gap: 6px;
    }

    .stat {
        min-width: 78px;

        padding: 8px;
    }

    .stat-value {
        font-size: 18px;
    }

    .target-zone {
        top: 57%;
    }

    .row {
        grid-template-columns:
            45px
            1fr
            90px;

        padding: 12px;
    }

    .row .combo-score {
        display: none;
    }

    .header-row .combo-score {
        display: none;
    }

    .sound-button {
        width: 46px;
        height: 46px;

        top: 12px;
        right: 12px;

        font-size: 21px;
    }
}
</style>
</head>

<body>

<!-- SES -->

<button
    class="sound-button"
    id="soundButton"

>
    🔊
</button>


<!-- İSİM EKRANI -->

<div

<script>
/* =========================================================
   SUPABASE
========================================================= */
const API_URL =
    "https://sqotorneqppbwsmnyxmy.supabase.co/functions/v1/swift-service";
const SUPABASE_FUNCTION_URL =
    "https://sqotorneqppbwsmnyxmy.supabase.co/functions/v1/swift-service";

const SUPABASE_KEY =
    "sb_publishable_wUBbPRmoS1SkvRM88SqWLw_yKoUx4Rf";


/* =========================================================
   ELEMENTLER
========================================================= */

const playerName = document.getElementById("playerName");
const startBtn = document.getElementById("startBtn");
const finishBtn = document.getElementById("finishBtn");
const overlay = document.getElementById("overlay");
const bag = document.getElementById("bag");
const gameArea = document.getElementById("gameArea");

const scoreElement = document.getElementById("score");
const hitsElement = document.getElementById("hits");
const comboElement = document.getElementById("comboValue");
const bestElement = document.getElementById("best");

const comboText = document.getElementById("comboText");
const leaderboardRows = document.getElementById("leaderboardRows");


/* =========================================================
   OYUN DEĞİŞKENLERİ
========================================================= */

let gameStarted = false;

let score = 0;
let hits = 0;
let combo = 0;
let highestCombo = 0;

let lastHitTime = 0;

const COMBO_TIMEOUT = 900;


/* =========================================================
   SES
========================================================= */

let audioContext = null;
let soundEnabled = true;

function initAudio() {

    if (!audioContext) {
        audioContext =
            new (window.AudioContext ||
                window.webkitAudioContext)();
    }

    if (audioContext.state === "suspended") {
        audioContext.resume();
    }
}

function punchSound(critical = false) {

    if (!soundEnabled) return;

    initAudio();

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.type =
        critical ? "square" : "sine";

    oscillator.frequency.setValueAtTime(
        critical ? 180 : 110,
        audioContext.currentTime
    );

    oscillator.frequency.exponentialRampToValueAtTime(
        critical ? 80 : 55,
        audioContext.currentTime + 0.08
    );

    gain.gain.setValueAtTime(
        critical ? 0.13 : 0.08,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + 0.09
    );

    oscillator.start();

    oscillator.stop(
        audioContext.currentTime + 0.1
    );
}


/* =========================================================
   SES BUTONU
========================================================= */

const soundButton =
    document.createElement("button");

soundButton.id = "soundButton";

soundButton.innerHTML = "🔊";

soundButton.title = "Sesi aç / kapat";

soundButton.style.position = "fixed";
soundButton.style.top = "15px";
soundButton.style.right = "15px";
soundButton.style.width = "48px";
soundButton.style.height = "48px";
soundButton.style.padding = "0";
soundButton.style.borderRadius = "50%";
soundButton.style.background = "rgba(15,23,42,.9)";
soundButton.style.border =
    "1px solid rgba(255,255,255,.15)";
soundButton.style.fontSize = "21px";
soundButton.style.zIndex = "9999";
soundButton.style.cursor = "pointer";

document.body.appendChild(soundButton);

soundButton.addEventListener("click", () => {

    soundEnabled = !soundEnabled;

    soundButton.innerHTML =
        soundEnabled ? "🔊" : "🔇";

    if (soundEnabled) {
        initAudio();
    }
});


/* =========================================================
   SUPABASE İSTEĞİ
========================================================= */

async function supabaseRequest(action, data = {}) {

    const response = await fetch(
        SUPABASE_FUNCTION_URL,
        {
            method: "POST",

            headers: {
                "Content-Type": "application/json",
                "apikey": SUPABASE_KEY,
                "Authorization":
                    "Bearer " + SUPABASE_KEY
            },

            body: JSON.stringify({
                action,
                ...data
            })
        }
    );

    const text = await response.text();

    let result;

    try {
        result = JSON.parse(text);
    } catch {
        throw new Error(
            "Sunucudan geçersiz cevap geldi: " +
            text
        );
    }

    if (!response.ok) {
        throw new Error(
            result.error ||
            "Sunucu isteği başarısız."
        );
    }

    return result;
}


/* =========================================================
   İSİM KONTROLÜ
========================================================= */

async function checkPlayerName(name) {

    try {

        const result =
            await supabaseRequest(
                "check_name",
                {
                    name
                }
            );

        return result.available === true;

    } catch (error) {

        console.error(
            "İsim kontrolü:",
            error
        );

        alert(
            "⚠️ Sunucuya bağlanılamadı.\n\n" +
            "Supabase bağlantısını kontrol et."
        );

        return false;
    }
}


/* =========================================================
   OYUNU BAŞLAT
========================================================= */

async function startGame() {

    const name =
        playerName.value.trim();

    if (!name) {

        playerName.focus();

        return;
    }

    if (name.length < 2) {

        alert(
            "İsim en az 2 karakter olmalı."
        );

        return;
    }

    if (name.length > 20) {

        alert(
            "İsim en fazla 20 karakter olabilir."
        );

        return;
    }


    startBtn.disabled = true;
    startBtn.textContent = "KONTROL EDİLİYOR...";


    const available =
        await checkPlayerName(name);


    startBtn.disabled = false;
    startBtn.textContent = "OYUNA BAŞLA";


    if (!available) {

        alert(
            "❌ Bu isim daha önce kullanılmış.\n\n" +
            "Başka bir isim seç."
        );

        playerName.focus();

        return;
    }


    initAudio();

    gameStarted = true;

    score = 0;
    hits = 0;
    combo = 0;
    highestCombo = 0;
    lastHitTime = 0;

    updateStats();

    /*
       İsim alanı ve başlatma butonu kayboluyor.
    */

    playerName.style.display = "none";
    startBtn.style.display = "none";

    finishBtn.style.display = "inline-block";

    overlay.classList.add("hidden");

    /*
       Üst başlığa oyuncunun ismini göster.
    */

    const oldPlayer =
        document.getElementById(
            "currentPlayer"
        );

    if (oldPlayer) {
        oldPlayer.remove();
    }

    const playerLabel =
        document.createElement("div");

    playerLabel.id =
        "currentPlayer";

    playerLabel.textContent =
        "🥊 " + name;

    playerLabel.style.position =
        "fixed";

    playerLabel.style.top =
        "22px";

    playerLabel.style.left =
        "22px";

    playerLabel.style.padding =
        "8px 14px";

    playerLabel.style.borderRadius =
        "20px";

    playerLabel.style.background =
        "rgba(15,23,42,.85)";

    playerLabel.style.zIndex =
        "9998";

    document.body.appendChild(
        playerLabel
    );
}


/* =========================================================
   OYUNU BİTİR
========================================================= */

async function finishGame() {

    if (!gameStarted) return;

    gameStarted = false;

    finishBtn.style.display = "none";

    playerName.style.display = "block";
    startBtn.style.display = "inline-block";

    playerName.disabled = false;

    try {

        finishBtn.textContent =
            "KAYDEDİLİYOR...";

        finishBtn.disabled = true;

        const result =
            await supabaseRequest(
                "submit_score",
                {
                    name:
                        playerName.value.trim(),

                    hits:
                        hits,

                    highestCombo:
                        highestCombo
                }
            );

        console.log(
            "Skor kaydedildi:",
            result
        );

    } catch (error) {

        console.error(
            "Skor kaydetme:",
            error
        );

        alert(
            "⚠️ Skor sunucuya kaydedilemedi.\n\n" +
            error.message
        );
    }

    finishBtn.disabled = false;
    finishBtn.textContent =
        "OYUNU BİTİR";

    playerName.value = "";

    combo = 0;

    updateStats();

    await renderLeaderboard();

    overlay.classList.remove(
        "hidden"
    );

    overlay.innerHTML = `
        <div class="overlay-box">

            <h2>🏆 Oyun Bitti!</h2>

            <p>
                Toplam skor:
                <strong>
                    ${score.toLocaleString("tr-TR")}
                </strong>
            </p>

            <p>
                Vuruş:
                <strong>${hits}</strong>
                <br>
                En yüksek combo:
                <strong>x${highestCombo}</strong>
            </p>

            <p>
                Yeni oyun için yukarıdan
                yeni bir isim gir.
            </p>

        </div>
    `;

    const currentPlayer =
        document.getElementById(
            "currentPlayer"
        );

    if (currentPlayer) {
        currentPlayer.remove();
    }
}


/* =========================================================
   TORBAYA VURMA
========================================================= */

function hitBag(event) {

    if (!gameStarted) return;

    event.preventDefault();

    const now =
        performance.now();

    if (
        now - lastHitTime <=
        COMBO_TIMEOUT
    ) {
        combo++;
    } else {
        combo = 1;
    }

    lastHitTime = now;

    hits++;

    if (combo > highestCombo) {
        highestCombo = combo;
    }


    let multiplier = 1;

    if (combo >= 30) {
        multiplier = 5;
    }
    else if (combo >= 20) {
        multiplier = 4;
    }
    else if (combo >= 10) {
        multiplier = 3;
    }
    else if (combo >= 5) {
        multiplier = 2;
    }


    const critical =
        Math.random() < 0.07;

    let points =
        10 * multiplier;

    if (critical) {
        points *= 3;
    }

    score += points;

    updateStats();

    animateBag();

    punchSound(critical);

    showFloatingScore(
        event,
        points,
        critical
    );

    if (combo >= 2) {
        showCombo();
    }
}


/* =========================================================
   ANİMASYON
========================================================= */

function animateBag() {

    bag.classList.remove("hit");

    void bag.offsetWidth;

    bag.classList.add("hit");

    gameArea.classList.remove(
        "shake"
    );

    void gameArea.offsetWidth;

    gameArea.classList.add(
        "shake"
    );
}


function showCombo() {

    comboText.textContent =
        `COMBO x${combo}`;

    comboText.classList.remove(
        "show"
    );

    void comboText.offsetWidth;

    comboText.classList.add(
        "show"
    );
}


function showFloatingScore(
    event,
    points,
    critical
) {

    const floating =
        document.createElement(
            "div"
        );

    floating.className =
        "floating-score";

    floating.textContent =
        critical
            ? `CRITICAL +${points}`
            : `+${points}`;

    const rect =
        gameArea.getBoundingClientRect();

    let x;
    let y;

    if (
        event.clientX !== undefined
    ) {

        x =
            event.clientX -
            rect.left;

        y =
            event.clientY -
            rect.top;

    } else {

        const bagRect =
            bag.getBoundingClientRect();

        x =
            bagRect.left -
            rect.left +
            bagRect.width / 2;

        y =
            bagRect.top -
            rect.top +
            bagRect.height / 2;
    }

    floating.style.left =
        `${x}px`;

    floating.style.top =
        `${y}px`;

    if (critical) {
        floating.style.color =
            "#fbbf24";
    }

    gameArea.appendChild(
        floating
    );

    setTimeout(
        () => floating.remove(),
        800
    );
}


/* =========================================================
   İSTATİSTİK
========================================================= */

function updateStats() {

    scoreElement.textContent =
        score.toLocaleString("tr-TR");

    hitsElement.textContent =
        hits;

    comboElement.textContent =
        `x${combo}`;
}


/* =========================================================
   LİDERLİK TABLOSU
========================================================= */

async function renderLeaderboard() {

    try {

        const result =
            await supabaseRequest(
                "leaderboard"
            );

        const scores =
            result.scores || [];

        leaderboardRows.innerHTML =
            "";

        if (!scores.length) {

            leaderboardRows.innerHTML = `
                <div class="empty">
                    Henüz skor yok.
                </div>
            `;

            bestElement.textContent =
                "0";

            return;
        }


        bestElement.textContent =
            Number(
                scores[0].score
            ).toLocaleString(
                "tr-TR"
            );


        scores.forEach(
            (item, index) => {

                const row =
                    document.createElement(
                        "div"
                    );

                row.className =
                    "row";

                let medal = "";

                if (index === 0)
                    medal = "🥇";

                if (index === 1)
                    medal = "🥈";

                if (index === 2)
                    medal = "🥉";


                row.innerHTML = `
                    <div class="rank">
                        ${medal || index + 1}
                    </div>

                    <div>
                        ${escapeHtml(
                            item.player_name
                        )}
                    </div>

                    <div class="score">
                        ${Number(
                            item.score
                        ).toLocaleString(
                            "tr-TR"
                        )}
                    </div>

                    <div class="combo-score">
                        x${item.highest_combo}
                    </div>
                `;

                leaderboardRows.appendChild(
                    row
                );
            }
        );

    } catch (error) {

        console.error(
            "Leaderboard:",
            error
        );

        leaderboardRows.innerHTML = `
            <div class="empty">
                ⚠️ Skor tablosuna bağlanılamadı.
            </div>
        `;
    }
}


/* =========================================================
   GÜVENLİ HTML
========================================================= */

function escapeHtml(text) {

    return String(text)
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );
}


/* =========================================================
   EVENTLER
========================================================= */

startBtn.addEventListener(
    "click",
    startGame
);

finishBtn.addEventListener(
    "click",
    finishGame
);

bag.addEventListener(
    "pointerdown",
    hitBag
);


/*
   Enter ile başla
*/

playerName.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {
            startGame();
        }
    }
);


/*
   Combo sıfırlama
*/

setInterval(() => {

    if (!gameStarted) return;

    if (
        lastHitTime &&
        performance.now() -
            lastHitTime >
            COMBO_TIMEOUT
    ) {

        combo = 0;

        comboElement.textContent =
            "x0";
    }

}, 100);


/* =========================================================
   BAŞLANGIÇ
========================================================= */

renderLeaderboard();

updateStats();

</script>

</body>
</html>
